<script>
function toggleMenu() {
    const navLinks = document.querySelector('#nav ul.links');
    navLinks.classList.toggle('show');
}
</script>

<script>
const navLinks = document.querySelectorAll('#nav ul.links li a');
const currentPage = window.location.pathname;

navLinks.forEach(link => {
  if (currentPage.endsWith(link.getAttribute("href"))) {
    link.parentElement.classList.add("active");
  }
});
</script>

<script>
  // Toggle on click for parent trigger
  document.querySelectorAll('#nav .has-dropdown, #menu .has-dropdown, #navPanel .has-dropdown, #nav .dropdown')
  .forEach(trigger => {
    trigger.addEventListener('click', e => {
      e.preventDefault();
      const li = trigger.closest('li');
      li.classList.toggle('open');
    });
  });

  // Close if clicking outside the nav
  document.addEventListener('click', (e) => {
    if (!e.target.closest('#nav')) {
      document.querySelectorAll('#nav ul.links li.open').forEach(li => {
        li.classList.remove('open');
        const t = li.querySelector('.has-dropdown');
        if (t) t.setAttribute('aria-expanded', 'false');
      });
    }
  });

</script>
